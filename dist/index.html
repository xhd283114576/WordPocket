<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="WordPocket — 随时随地记录、整理和复习英文单词。">
  <title>WordPocket · 随手记单词</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="WordPocket 首页">
      <span class="brand-mark" aria-hidden="true">W</span>
      <span>WordPocket</span>
    </a>
    <div class="top-actions">
      <button id="exportBtn" class="button ghost" type="button">导出</button>
      <label class="button ghost" for="importInput">导入</label>
      <input id="importInput" type="file" accept="application/json" hidden>
    </div>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">YOUR PERSONAL WORD BANK</p>
        <h1 id="pageTitle">遇见好词，马上收进口袋。</h1>
        <p>记录单词、释义和语境。所有内容保存在你的设备上。</p>
      </div>
      <div class="stats" aria-label="词库统计">
        <div><strong id="totalCount">0</strong><span>全部</span></div>
        <div><strong id="learningCount">0</strong><span>学习中</span></div>
        <div><strong id="masteredCount">0</strong><span>已掌握</span></div>
      </div>
    </section>

    <section class="workspace">
      <form id="wordForm" class="composer" autocomplete="off">
        <div class="composer-heading">
          <h2>记一个新词</h2>
          <span class="shortcut">Ctrl / ⌘ + Enter 保存</span>
        </div>
        <div class="field-grid">
          <label class="field word-field">
            <span>英文单词 *</span>
            <input id="wordInput" name="word" required maxlength="80" placeholder="serendipity" autofocus>
          </label>
          <label class="field">
            <span>中文释义 *</span>
            <input id="meaningInput" name="meaning" required maxlength="160" placeholder="意外发现美好事物的运气">
          </label>
          <label class="field full">
            <span>例句或笔记</span>
            <textarea id="exampleInput" name="example" maxlength="500" rows="3" placeholder="We met by pure serendipity."></textarea>
          </label>
          <label class="field full">
            <span>标签</span>
            <input id="tagsInput" name="tags" maxlength="120" placeholder="旅行, 阅读（用逗号分隔）">
          </label>
        </div>
        <div class="composer-footer">
          <span id="formMessage" class="form-message" role="status" aria-live="polite"></span>
          <button class="button primary" type="submit">收进口袋</button>
        </div>
      </form>

      <section class="library" aria-labelledby="libraryTitle">
        <div class="library-head">
          <div>
            <p class="section-kicker">MY WORDS</p>
            <h2 id="libraryTitle">我的词库</h2>
          </div>
          <button id="reviewBtn" class="button dark" type="button">随机复习</button>
        </div>

        <div class="toolbar">
          <label class="search">
            <span class="sr-only">搜索单词</span>
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索单词、释义、标签…">
          </label>
          <div class="filters" role="group" aria-label="筛选学习状态">
            <button class="filter active" type="button" data-filter="all">全部</button>
            <button class="filter" type="button" data-filter="learning">学习中</button>
            <button class="filter" type="button" data-filter="mastered">已掌握</button>
          </div>
        </div>

        <div id="wordList" class="word-list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          <span aria-hidden="true">Aa</span>
          <h3>口袋还是空的</h3>
          <p>从刚刚遇见的那个英文单词开始吧。</p>
        </div>
      </section>
    </section>
  </main>

  <dialog id="reviewDialog" class="review-dialog">
    <form method="dialog" class="review-card">
      <button class="icon-button close" value="cancel" aria-label="关闭复习">×</button>
      <p class="section-kicker">QUICK REVIEW</p>
      <button id="speakReviewBtn" class="speak" type="button" aria-label="朗读单词">↗</button>
      <h2 id="reviewWord"></h2>
      <button id="revealBtn" class="button primary reveal" type="button">显示答案</button>
      <div id="reviewAnswer" class="review-answer" hidden>
        <p id="reviewMeaning"></p>
        <blockquote id="reviewExample"></blockquote>
      </div>
      <div class="review-actions">
        <button id="nextReviewBtn" class="button dark" type="button">换一个</button>
        <button id="masterReviewBtn" class="button ghost" type="button">标为已掌握</button>
      </div>
    </form>
  </dialog>

  <template id="wordTemplate">
    <article class="word-card">
      <div class="word-main">
        <div class="word-title-row">
          <h3 class="card-word"></h3>
          <button class="icon-button speak-button" type="button" aria-label="朗读单词">▶</button>
        </div>
        <p class="card-meaning"></p>
        <blockquote class="card-example"></blockquote>
        <div class="card-tags"></div>
      </div>
      <div class="card-side">
        <button class="status-button" type="button"></button>
        <time class="card-date"></time>
        <button class="delete-button" type="button">删除</button>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
